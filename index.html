<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PGDAV LabTrack | Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="brand">
                <h1>PGDAV LabTrack</h1>
            </div>

            <!-- Login Section -->
            <div id="loginSection">

                <div class="login-heading">
                    <h2>Welcome Back!</h2>
                    <p>Login to access your PGDAV LabTrack account.</p>
                </div>

                <form id="loginForm">

                    <div class="form-group">
                        <label for="loginRole">Select Your Role</label>
                        <select id="loginRole" required>
                            <option value="">Choose your role</option>
                            <option value="admin">Super Admin</option>
                            <option value="lab_assistant">Lab Assistant</option>
                            <option value="student">Student</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-password-wrapper">
                            <input type="password" id="password" placeholder="Enter your password" required>
                            <button type="button" class="toggle-password-btn" id="toggleLoginPassword"
                                title="Show/Hide password">👁️</button>
                        </div>
                    </div>

                    <button type="submit" id="loginBtn">

                        Login
                    </button>

                    <p id="message"></p>
                    <p class="auth-switch">
                        <a href="forgot-password.html" id="forgotPassword">Forgot Password?</a>
                    </p>

                </form>

                <p class="auth-switch">
                    Don't have an account?
                    <a href="signup.html" id="showSignup">Register as Student</a>
                </p>

            </div>

            <div class="login-footer">
                <p>PGDAV LabTrack • Laboratory Equipment Management System</p>
            </div>

        </section>

    </main>

    <script type="module" src="js/app.js"></script>

</body>

</html>
