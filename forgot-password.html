<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGDAV LabTrack | Forgot Password</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="brand">
                <div class="brand-icon">QR</div>
                <h1>PGDAV LabTrack</h1>
            </div>

            <div class="login-heading">
                <h2>Reset Password</h2>
                <p>Enter your registered email address to receive password recovery instructions.</p>
            </div>

            <form id="forgotPasswordForm">

                <div class="form-group">
                    <label for="resetEmail">Email Address</label>
                    <input type="email" id="resetEmail" placeholder="Enter your registered email" required>
                </div>

                <button type="submit" id="resetBtn" class="btn btn-primary"
                    style="width: 100%; padding: 13px; font-size: 15px; font-weight: 700; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px;">
                    <span id="resetBtnText">Send Reset Link</span>
                </button>

                <p id="resetMessage" style="margin-top: 14px; text-align: center; font-size: 13.5px; font-weight: 500;">
                </p>

            </form>

            <p class="auth-switch" style="margin-top: 24px;">
                Remember your password?
                <a href="index.html">Back to Login</a>
            </p>

            <div class="login-footer">
                <p>PGDAV LabTrack • Laboratory Equipment Management System</p>
            </div>

        </section>

    </main>

    <script type="module">
        import { auth, sendPasswordResetEmail, isAuthorizedEmail } from "./js/app.js";

        const form = document.getElementById("forgotPasswordForm");
        const emailInput = document.getElementById("resetEmail");
        const resetBtn = document.getElementById("resetBtn");
        const message = document.getElementById("resetMessage");

        if (form) {
            form.addEventListener("submit", async (e) => {
                e.preventDefault();

                const email = emailInput.value.trim().toLowerCase();
                if (!email) {
                    message.textContent = "Please enter your email address.";
                    message.style.color = "var(--danger)";
                    return;
                }

                if (!isAuthorizedEmail(email)) {
                    message.textContent = "Please enter an authorized institutional email address.";
                    message.style.color = "var(--danger)";
                    return;
                }

                resetBtn.disabled = true;
                const btnText = document.getElementById("resetBtnText");
                if (btnText) btnText.textContent = "Sending Instructions...";
                message.textContent = "Sending password reset instructions...";
                message.style.color = "var(--primary)";

                try {
                    await sendPasswordResetEmail(auth, email);
                    message.textContent = "Password reset link sent! Please check your inbox and spam folder.";
                    message.style.color = "var(--success)";
                    form.reset();
                } catch (error) {
                    console.error("Password reset error:", error);
                    let errMsg = "Unable to send reset email. Please verify your address.";
                    if (error.code === "auth/user-not-found") {
                        errMsg = "No account found matching this email address.";
                    } else if (error.code === "auth/too-many-requests") {
                        errMsg = "Too many attempts. Please try again in a few minutes.";
                    }
                    message.textContent = errMsg;
                    message.style.color = "var(--danger)";
                } finally {
                    resetBtn.disabled = false;
                    if (btnText) btnText.textContent = "Send Password Reset Link";
                }
            });
        }
    </script>

</body>

</html>
